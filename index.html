<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบล็อกอินแอดมิน</title>
<style>
body {font-family:sans-serif; max-width:400px;margin:30px auto;}
input, button {display:block;width:100%;margin:10px 0;padding:10px;}
#status {color:blue;}
</style>
</head>
<body>
<h1>ระบบลงทะเบียนแอดมิน</h1>
<input id="sid" placeholder="รหัสนักศึกษา">
<input id="pass" type="password" placeholder="รหัสผ่าน">
<button id="btnRegister">ลงทะเบียน</button>
<p id="status"></p>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxzgLc2mWuUAhJq-FKOSwWpoeKr1Cuj7EU1iBBScO7Bc-fg5qQp9QzNpeXFgPHPL1i0Rw/exec';

// ฟังก์ชันเข้ารหัส SHA-256
async function sha256Base64(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}

document.getElementById('btnRegister').addEventListener('click', async ()=>{
  const sid = document.getElementById('sid').value.trim();
  const pass = document.getElementById('pass').value;
  if(!sid||!pass){document.getElementById('status').innerText='กรอกให้ครบ'; return;}

  document.getElementById('status').innerText='กำลังลงทะเบียน...';

  const hash = await sha256Base64(sid + '|' + pass);

  fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sid, passHash: hash})
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.success){
      document.getElementById('status').innerText='ลงทะเบียนสำเร็จ' + (res.isAdmin?' (แอดมิน)':'');
    } else {
      document.getElementById('status').innerText=res.message;
    }
  })
  .catch(e=>{
    document.getElementById('status').innerText='เกิดข้อผิดพลาด';
    console.error(e);
  });
});
</script>
</body>
</html>
