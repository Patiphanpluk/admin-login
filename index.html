<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบล็อกอิน Admin</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--accent:#1f6feb}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;display:flex;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg),#eef3ff)}
.card{width:100%;max-width:560px;padding:28px;background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(20,30,60,.08)}
h1{margin:0 0 12px;font-size:20px}
p.lead{margin:0 0 18px;color:#586173}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:8px;border:1px solid #e6e9f2;background:#fff;cursor:pointer}
.tabs button.active{background:linear-gradient(90deg,var(--accent),#4da3ff);color:#fff;border:none}
form{display:grid;gap:10px}
label{font-size:13px;color:#314152}
input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid #dbe4f5;border-radius:8px}
.row{display:flex;gap:10px}
.btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;position:relative;overflow:hidden}
.btn.primary{background:var(--accent);color:#fff;transition:background 0.3s}
.btn.ghost{background:transparent;border:1px solid #dbe4f5}
.btn.loading{background:#4da3ff;pointer-events:none;opacity:0.8}
.btn.loading::after{
  content:"";
  position:absolute;
  right:12px;
  top:50%;
  width:16px;
  height:16px;
  border:2px solid #fff;
  border-top-color:transparent;
  border-radius:50%;
  transform:translateY(-50%);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.msg{padding:10px;border-radius:8px;font-size:14px;margin-top:10px}
.msg.error{background:#fff1f0;color:#b42318;border:1px solid #ffd7d4}
.msg.ok{background:#f0fff6;color:#066b3d;border:1px solid #bff0d6}
.small{font-size:12px;color:#8a93a6}
</style>
</head>
<body>
<div class="card">
<h1>ระบบล็อกอินสำหรับแอดมิน</h1>
<p class="lead">กรอกรหัสนักศึกษาเพื่อเข้าสู่ระบบหรือสมัครใช้งาน</p>

<form id="form-check">
  <label>รหัสนักศึกษา</label>
  <input id="check-student" type="text" placeholder="เช่น 65030138" required>
  <button type="submit" class="btn primary" id="btn-check">ตรวจสอบสิทธิ์</button>
</form>

<div id="content" style="display:none;">
  <div class="tabs">
    <button id="tab-register" class="active">ลงทะเบียน</button>
    <button id="tab-login">ล็อกอิน</button>
  </div>

  <form id="form-register">
    <label>รหัสนักศึกษา</label>
    <input id="reg-student" type="text" readonly>

    <label>รหัสผ่าน</label>
    <input id="reg-pass" type="password" placeholder="ตั้งรหัสผ่าน" required>

    <div class="row">
      <button type="submit" class="btn primary" id="btn-register">ลงทะเบียน</button>
      <button type="button" id="reg-reset" class="btn ghost">ล้าง</button>
    </div>
  </form>

  <form id="form-login" style="display:none;">
    <label>รหัสนักศึกษา</label>
    <input id="log-student" type="text" readonly>

    <label>รหัสผ่าน</label>
    <input id="log-pass" type="password" placeholder="รหัสผ่าน" required>

    <div class="row">
      <button type="submit" class="btn primary" id="btn-login">เข้าสู่ระบบ</button>
      <button type="button" id="log-reset" class="btn ghost">ล้าง</button>
    </div>
  </form>

  <div id="message"></div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbymR5vBJtPhNegp9cmYoHwGM5KZ1IgoVTxIDEIXUijvoevSJVglA8_IzO-WhB58JjEpkg/exec';

// ฟังก์ชันช่วยเหลือ
function showMessage(text,type='error'){
  document.getElementById('message').innerHTML = `<div class="msg ${type==='ok'?'ok':'error'}">${text}</div>`;
}
function clearMessage(){ document.getElementById('message').innerHTML=''; }
function setLoading(btn,state=true){
  btn.classList.toggle('loading', state);
  btn.disabled = state;
}

// ตรวจสอบสิทธิ์
document.getElementById('form-check').addEventListener('submit', async e=>{
  e.preventDefault();
  const sid = document.getElementById('check-student').value.trim();
  const btn = document.getElementById('btn-check');
  if(!sid){alert('กรุณากรอกรหัสนักศึกษา'); return;}
  setLoading(btn,true);
  try{
    const res = await fetch(WEB_APP_URL, {
      method:'POST',
      body: JSON.stringify({action:'checkRegister', studentId: sid}),
      headers: {'Content-Type':'application/json'}
    });
    const data = await res.json();
    document.getElementById('form-check').style.display='none';
    document.getElementById('content').style.display='';
    document.getElementById('reg-student').value = sid;
    document.getElementById('log-student').value = sid;
    if(data.registered){ document.getElementById('tab-login').click(); }
    else { document.getElementById('tab-register').click(); }
  }catch(err){ alert('เกิดข้อผิดพลาด: '+err); }
  finally{ setLoading(btn,false); }
});

// Tabs
document.getElementById('tab-register').addEventListener('click',()=>{
  document.getElementById('form-register').style.display='';
  document.getElementById('form-login').style.display='none';
  document.getElementById('tab-register').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  clearMessage();
});
document.getElementById('tab-login').addEventListener('click',()=>{
  document.getElementById('form-register').style.display='none';
  document.getElementById('form-login').style.display='';
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-register').classList.remove('active');
  clearMessage();
});

// ลงทะเบียน
document.getElementById('form-register').addEventListener('submit',async e=>{
  e.preventDefault(); clearMessage();
  const sid = document.getElementById('reg-student').value;
  const pass = document.getElementById('reg-pass').value;
  const btn = document.getElementById('btn-register');
  setLoading(btn,true);
  try{
    const res = await fetch(WEB_APP_URL, {
      method:'POST',
      body: JSON.stringify({action:'register', studentId:sid, pass:pass}),
      headers: {'Content-Type':'application/json'}
    });
    const data = await res.json();
    showMessage(data.message, data.success?'ok':'error');
    if(data.success) setTimeout(()=>document.getElementById('tab-login').click(),1000);
  }catch(err){ showMessage('เกิดข้อผิดพลาด: '+err); }
  finally{ setLoading(btn,false); }
});

// ล็อกอิน
document.getElementById('form-login').addEventListener('submit',async e=>{
  e.preventDefault(); clearMessage();
  const sid = document.getElementById('log-student').value;
  const pass = document.getElementById('log-pass').value;
  const btn = document.getElementById('btn-login');
  setLoading(btn,true);
  try{
    const res = await fetch(WEB_APP_URL, {
      method:'POST',
      body: JSON.stringify({action:'login', studentId:sid, pass:pass}),
      headers: {'Content-Type':'application/json'}
    });
    const data = await res.json();
    if(data.success && data.isAdmin){
      showMessage('เข้าสู่ระบบสำเร็จ กำลังพาไปยังลิงก์...','ok');
      setTimeout(()=>window.location.href = data.link, 800);
    }else{ showMessage(data.message); }
  }catch(err){ showMessage('เกิดข้อผิดพลาด: '+err); }
  finally{ setLoading(btn,false); }
});
</script>
</body>
</html>
